[project]
name = "linux-learning-library"
version = "0.1.0"
description = "A runnable learning library about the Linux shell — and what changes on a Mac, in zsh and in fish — one idea per page, every claim backed by a program that runs, published as a searchable site."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
# The MkDocs site build. To change a docs dependency, edit here and run `uv lock`.
# mkdocs-same-dir is pinned exactly: it is the plugin that lets the docs root be
# the repo root, and it is the one most likely to break the whole build silently.
#
# Note what is NOT here: anything the examples need. They are bash, zsh, fish,
# fzf and the system's own grep and coreutils -- nothing from PyPI.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
